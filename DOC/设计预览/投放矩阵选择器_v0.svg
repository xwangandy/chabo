<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1600" viewBox="0 0 1080 1600">
  <defs>
    <style>
      .bg { fill: #0f1117; }
      .phone { fill: #171a21; stroke: #2a2f3a; stroke-width: 2; }
      .bubble { fill: #22262f; }
      .bubble2 { fill: #1d222b; }
      .button { fill: #2b313b; stroke: #384252; stroke-width: 1.5; }
      .buttonOn { fill: #214a38; stroke: #43d17b; stroke-width: 2; }
      .buttonWarn { fill: #3d3324; stroke: #f5b84b; stroke-width: 2; }
      .primary { fill: #3f8cff; }
      .muted { fill: #97a0ad; }
      .text { fill: #f1f4f8; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
      .small { font-size: 24px; }
      .body { font-size: 30px; }
      .title { font-size: 38px; font-weight: 700; }
      .big { font-size: 48px; font-weight: 800; }
      .label { font-size: 26px; fill: #b9c1cc; }
      .price { font-size: 34px; font-weight: 800; fill: #76ff9f; }
      .divider { stroke: #343a46; stroke-width: 2; }
    </style>
  </defs>

  <rect class="bg" width="1080" height="1600"/>
  <rect class="phone" x="130" y="40" width="820" height="1520" rx="44"/>

  <rect x="130" y="40" width="820" height="110" rx="44" fill="#1b2028"/>
  <circle cx="202" cy="95" r="38" fill="#5fb4ff"/>
  <text class="text title" x="188" y="108">插</text>
  <text class="text title" x="262" y="88">插播广告</text>
  <text class="muted text small" x="262" y="124">bot · 投放配置预览</text>

  <rect class="bubble" x="170" y="190" width="740" height="1210" rx="26"/>

  <text class="text title" x="210" y="250">📣 频道招商</text>
  <text class="text label" x="210" y="303">目标频道</text>
  <text class="text body" x="210" y="346">📺 广告投放测试1</text>

  <rect class="bubble2" x="210" y="385" width="660" height="150" rx="22"/>
  <text class="text label" x="245" y="430">预计费用</text>
  <text class="text big" x="245" y="488">USD 12.00</text>
  <text class="text small" x="555" y="488" fill="#76ff9f">单次发布</text>
  <text class="text small" x="245" y="520" fill="#97a0ad">选择会实时刷新；继续前不扣费</text>

  <line class="divider" x1="210" y1="570" x2="870" y2="570"/>
  <text class="text title" x="210" y="625">1 选择展示形态</text>
  <text class="text small" x="210" y="662" fill="#97a0ad">可以按频道规则单选或多选</text>

  <rect class="buttonOn" x="210" y="695" width="660" height="92" rx="18"/>
  <text class="text body" x="245" y="752">✅ 文字插播</text>
  <text class="text small" x="600" y="752">USD 2.00</text>
  <text class="text small" x="245" y="780" fill="#b9c1cc">插到最新内容帖底部 · 不可置顶</text>

  <rect class="buttonOn" x="210" y="810" width="430" height="92" rx="18"/>
  <text class="text body" x="245" y="865">✅ 标准插播</text>
  <text class="text small" x="470" y="865">USD 5.00</text>
  <rect class="buttonWarn" x="655" y="810" width="215" height="92" rx="18"/>
  <text class="text body" x="686" y="865">📌 置顶</text>
  <text class="text small" x="686" y="895">+USD 5.00</text>

  <rect class="button" x="210" y="925" width="430" height="92" rx="18"/>
  <text class="text body" x="245" y="980">⬜ 定制插播</text>
  <text class="text small" x="470" y="980">USD 20.00</text>
  <rect class="button" x="655" y="925" width="215" height="92" rx="18"/>
  <text class="text body" x="686" y="980">📌 置顶</text>
  <text class="text small" x="686" y="1010">未启用</text>

  <line class="divider" x1="210" y1="1060" x2="870" y2="1060"/>
  <text class="text title" x="210" y="1115">2 发布模式</text>

  <rect class="buttonOn" x="210" y="1145" width="315" height="78" rx="18"/>
  <text class="text body" x="250" y="1195">✅ 发布一次</text>
  <rect class="button" x="555" y="1145" width="315" height="78" rx="18"/>
  <text class="text body" x="590" y="1195">🔁 循环发布</text>

  <text class="text small" x="210" y="1270" fill="#97a0ad">循环发布启用后显示频率和周期：</text>
  <rect class="button" x="210" y="1295" width="205" height="70" rx="16"/>
  <text class="text small" x="252" y="1340">24h/次</text>
  <rect class="button" x="440" y="1295" width="205" height="70" rx="16"/>
  <text class="text small" x="487" y="1340">7天 9折</text>
  <rect class="button" x="665" y="1295" width="205" height="70" rx="16"/>
  <text class="text small" x="710" y="1340">30天 8折</text>

  <rect class="primary" x="210" y="1430" width="660" height="86" rx="22"/>
  <text class="text title" x="382" y="1485">继续：选择广告素材</text>

  <text class="text small" x="170" y="1540" fill="#687180">v0 草图：先确认矩阵，再改真实下单和数据模型</text>
</svg>
