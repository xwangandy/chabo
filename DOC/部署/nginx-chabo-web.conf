# 插播 React SPA + FastAPI API nginx 样例
#
# 假设：
# - 域名是 chabo.example
# - React 构建产物部署到 /opt/chabo/web/dist
# - FastAPI API 由 chabo-api.service 监听 127.0.0.1:8081
# - Telegram webhook / 旧 run-web 如需保留，可继续使用另一个 server/location 样例
# - 生产前先跑：chabo verify-web --profile production --host chabo.example --health-url https://chabo.example/api/health
#
# 路径策略：
# - /api/* 反代 FastAPI
# - /api/health 可作为 LB readiness，FastAPI 会跑 DB ping 并返回 ops 摘要
# - /login、/admin、/advertiser、/publisher 等 SPA 路由都回退到 index.html
# - 静态资源走 Vite 构建出的 /assets/*

server {
    listen 80;
    server_name chabo.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chabo.example;

    ssl_certificate     /etc/letsencrypt/live/chabo.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chabo.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root /opt/chabo/web/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/health {
        proxy_pass http://127.0.0.1:8081/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 2m;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
