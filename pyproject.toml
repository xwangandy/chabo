[project]
name = "chabo"
version = "0.1.0"
description = "插播 Telegram channel ad insertion MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
chabo = "chabo.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
