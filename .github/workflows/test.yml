name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      production_host:
        description: 'Optional: run production web gate against this host, for example chabo.example'
        required: false
        type: string
      production_health_url:
        description: 'Optional: defaults to https://<production_host>/api/health'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    env:
      CHABO_DB_PATH: ${{ github.workspace }}/.runtime/chabo-ci-${{ matrix.python-version }}.sqlite3
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install package + web/dev deps
        run: pip install -e ".[web,dev]"

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Compile-check
        run: python -m compileall -q src tests

      - name: Run tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests
          python -m coverage report

      - name: Web verify (CI local gate)
        run: chabo verify-web --profile local --skip-tests --skip-health

  production-web-gate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.production_host != '' }}
    runs-on: ubuntu-latest
    env:
      CHABO_DB_PATH: ${{ github.workspace }}/.runtime/chabo-production-gate.sqlite3
      CHABO_ADMIN_TOKEN: ${{ secrets.CHABO_ADMIN_TOKEN }}
      CHABO_WEBHOOK_SECRET: ${{ secrets.CHABO_WEBHOOK_SECRET }}
      CHABO_API_SECRET_KEY: ${{ secrets.CHABO_API_SECRET_KEY }}
      CHABO_BOT_TOKEN: ${{ secrets.CHABO_BOT_TOKEN }}
      CHABO_BOT_USERNAME: ${{ vars.CHABO_BOT_USERNAME }}
      CHABO_SESSION_COOKIE_SECURE: '1'
      CHABO_SESSION_COOKIE_SAMESITE: lax
      CHABO_WEB_ALLOWED_ORIGINS: https://${{ inputs.production_host }}
      CHABO_API_PROXY_HEADERS: '1'
      CHABO_API_FORWARDED_ALLOW_IPS: 127.0.0.1
      CHABO_ENV: production
      CHABO_DEV_SESSION_ENABLED: '0'
      CHABO_DEV_AUTH_BYPASS: '0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install package + web deps
        run: pip install -e ".[web]"

      - name: Install frontend deps
        working-directory: web
        run: npm ci

      - name: Verify production web deployment
        run: |
          health_url="${{ inputs.production_health_url }}"
          if [ -z "$health_url" ]; then
            health_url="https://${{ inputs.production_host }}/api/health"
          fi
          chabo verify-web --profile production \
            --host "${{ inputs.production_host }}" \
            --health-url "$health_url"
