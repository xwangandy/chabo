# 插播 nginx 反向代理样例
#
# 假设：
# - 域名是 chabo.example
# - 已经用 certbot / acme.sh 配好 HTTPS 证书
# - 应用在本机 127.0.0.1:8080 跑（systemd-chabo.service 默认端口）
#
# 路径策略：
# - /telegram/webhook/<secret> 直通后端，做 webhook
# - /admin /admin/* 直通后端；token 校验在应用层完成
# - /health 直通后端；可被 LB / 监控系统拉取
# - 其余路径 404
#
# 如果未来加了内容资源（静态广告素材等），单独建一个 location 走 alias，
# 不要让用户上传文件路径走到 / 上去。

server {
    listen 80;
    server_name chabo.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chabo.example;

    ssl_certificate     /etc/letsencrypt/live/chabo.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chabo.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Telegram webhook
    location ~ ^/telegram/webhook/[A-Za-z0-9_-]+$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 1m;
    }

    # 运营 Admin（应用层用 CHABO_ADMIN_TOKEN 校验）
    location /admin {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 健康检查（LB / 监控）
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }

    # 其余路径直接 404
    location / {
        return 404;
    }
}
